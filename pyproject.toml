[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mammo-priors"
version = "0.1.0"
description = "An ablation ladder that measures what prior mammograms add to benign/malignant classification of a finding."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pillow>=10.0",
    "pydicom>=2.4",
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.optional-dependencies]
# Placing the prior windows by image registration instead of by the same pixel
# coordinates (`--correspondence centroid|affine|deformable`).
registration = ["SimpleITK>=2.3"]
# Compressed DICOM (JPEG / JPEG 2000 transfer syntaxes).
dicom-codecs = ["pylibjpeg>=2.0", "pylibjpeg-libjpeg>=2.0", "pylibjpeg-openjpeg>=2.0"]
test = ["pytest>=7"]

[project.scripts]
mammo-priors = "mammo_priors.cli:main"

[tool.setuptools.packages.find]
include = ["mammo_priors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
